{% extends 'base.html' %}{% block title %}Контакты{% endblock %}{% block content %}<div class="wrap content narrow"><div class="eyebrow">ОБРАТНАЯ СВЯЗЬ</div><h1>Есть <em>вопрос?</em></h1><p>Напиши нам — форма демонстрирует обработку POST и проверку полей.</p>{% if error %}<p class="field-error">{{ error }}</p>{% endif %}<form method="post" class="user-form">{% csrf_token %}<label>Имя<input name="name" value="{{ values.name|default:'' }}" required></label><label>Email<input name="email" type="email" value="{{ values.email|default:'' }}" required></label><label>Сообщение<textarea name="message" rows="5" required>{{ values.message|default:'' }}</textarea></label><button class="cta">Отправить →</button></form></div>{% endblock %}
